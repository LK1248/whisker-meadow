<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whisker Meadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen 3D meadow; HUD chips top-left, buttons top-right, tool dock bottom; stats float above the cat in the world. Single sunny look. */
:root{
  --cream:#fffaf2; --ink:#4a3426; --muted:#8c7666; --pink:#ff7aa2; --pinkd:#e0577f;
  --leaf:#5fb35a; --leafd:#3f8f3d; --sky:#bfe8f7; --gold:#f6c443; --line:#efdfca; --blue:#5b9be6;
  --display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#stage canvas.nocur{cursor:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.pill{background:var(--cream);border-radius:999px;box-shadow:0 2px 0 rgba(74,52,38,.12),0 6px 16px rgba(74,52,38,.12)}
.hud-l{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:55vw;z-index:5}
.chip{display:flex;align-items:center;gap:5px;padding:4px 12px 4px 5px;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.chip svg{width:26px;height:26px;flex:none}
.hud-r{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw;z-index:5}
.hbtn{min-height:44px;padding:0 15px;font:600 15px var(--display);display:flex;align-items:center;gap:6px}
.hbtn.primary{background:var(--pink);color:#fff}
.hbtn.icon{width:44px;padding:0;justify-content:center}
.hbtn svg{width:22px;height:22px}
.hbtn.off{opacity:.45}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:24px;z-index:5}
.tool{width:66px;height:62px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 13px var(--display);color:var(--muted);position:relative}
.tool svg{width:30px;height:30px}
.tool.on{background:#ffe3ec;color:var(--pinkd)}
.tool.locked{opacity:.45}
.tool .lock{position:absolute;top:4px;right:6px;font:700 10px var(--body);background:var(--gold);color:#5a3d00;border-radius:8px;padding:1px 5px}
#tag{position:fixed;left:0;top:0;background:rgba(255,250,242,.95);border-radius:16px;padding:6px 10px 8px;width:132px;pointer-events:none;z-index:4;box-shadow:0 4px 14px rgba(74,52,38,.18)}
#tag .tn{font:600 15px/1.1 var(--display);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tag .tn small,.rc small{font:700 11px var(--body);color:var(--muted)}
.t3{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;margin-top:4px}
.t3 svg{width:15px;height:15px}
.t3 .tb{height:8px;border-radius:5px;background:#efe3d2;overflow:hidden}
.t3 .tb i{display:block;height:100%;border-radius:5px;transition:width .25s}
#tShow{pointer-events:auto;margin-top:7px;width:100%;min-height:36px;border-radius:12px;background:var(--pink);color:#fff;font:600 15px var(--display);display:flex;align-items:center;justify-content:center;gap:5px;animation:pulse 1.2s ease-in-out infinite}
#tShow svg{width:20px;height:20px}
@keyframes pulse{50%{transform:scale(1.07)}}
#hand{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;z-index:9;transition:opacity .15s}
#hand.touch{margin-top:-80px}
#hand svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(74,52,38,.25))}
#hand .hb{display:none} #hand.brush .hb{display:block} #hand.brush .hp{display:none}
#hand.jerk svg{animation:jerk .5s}
@keyframes jerk{25%{transform:translate(-16px,26px) rotate(-22deg)}}
#hand.bump svg{animation:bump .45s}
@keyframes bump{35%{transform:translate(8px,-14px) rotate(8deg)}}
#hScr{transition:opacity .4s}
#ring{position:fixed;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;--p:0;background:conic-gradient(var(--pink) calc(var(--p)*1turn),rgba(255,255,255,.6) 0);-webkit-mask:radial-gradient(circle,transparent 26px,#000 27px);mask:radial-gradient(circle,transparent 26px,#000 27px);pointer-events:none;z-index:8}
#hint{position:fixed;left:0;top:0;pointer-events:none;z-index:6}
#hint .hh{position:absolute;left:-30px;top:-22px;width:60px;height:60px}
#hint .hh svg{width:100%;height:100%;filter:drop-shadow(0 4px 4px rgba(74,52,38,.3))}
#hint .lab{position:absolute;left:0;top:-70px;transform:translateX(-50%);white-space:nowrap;background:var(--cream);padding:7px 14px;border-radius:999px;font:600 18px var(--display);box-shadow:0 3px 0 rgba(74,52,38,.12),0 8px 18px rgba(74,52,38,.2)}
#hint .rip{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:4px solid var(--pink);opacity:0}
#hint.g-stroke .hh{animation:hstroke 3s ease-in-out infinite}
@keyframes hstroke{0%{transform:translate(-30px,0);opacity:1}30%{transform:translate(30px,0);opacity:1}42%{transform:translate(30px,-14px);opacity:.35}88%{transform:translate(-30px,-14px);opacity:.35}100%{transform:translate(-30px,0);opacity:1}}
#hint.g-tap .hh{animation:htap 1.1s ease-in-out infinite}
#hint.g-tap .rip{animation:rip 1.1s ease-out infinite}
@keyframes htap{0%,100%{transform:translateY(-10px)}40%{transform:translateY(4px) scale(.92)}}
@keyframes rip{40%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}
#hint.g-hold .hh{animation:hhold 1.8s ease-in-out infinite}
#hint.g-hold .rip{border-style:dotted;animation:hring 1.8s linear infinite}
@keyframes hhold{0%,100%{transform:translateY(-10px)}15%,80%{transform:translateY(4px) scale(.92)}}
@keyframes hring{10%{opacity:.9;transform:scale(1) rotate(0)}80%{opacity:.9;transform:scale(1) rotate(270deg)}100%{opacity:0}}
#hint.g-none .hh{display:none}
#toasts{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:7;pointer-events:none}
.toast{background:rgba(74,52,38,.86);color:#fff;padding:7px 16px;border-radius:999px;font:600 16px var(--display);white-space:nowrap;animation:pop .3s ease-out}
.toast.badge{background:linear-gradient(#ffe48a,#f6c443);color:#5a3d00}
.float{position:fixed;left:0;top:0;transform:translate(-50%,-50%);font:700 22px var(--display);color:#fff;text-shadow:0 2px 0 rgba(74,52,38,.35),0 0 8px rgba(74,52,38,.25);pointer-events:none;z-index:7;animation:rise 1.4s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;background:rgba(60,40,30,.35);display:grid;place-items:center;z-index:20;padding:16px}
#modal .box{background:var(--cream);border-radius:26px;padding:20px 18px 18px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 50px rgba(60,40,30,.35);animation:pop .25s ease-out;position:relative}
#modal h3,#meet h3{margin:0 0 12px;font:700 26px var(--display)}
#modal .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;background:#f3e7d6;font:700 20px var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:18px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.item .ico{height:46px;display:grid;place-items:center}
.item .ico svg{height:42px;width:42px}
.item b{font:600 16px var(--display);text-align:center}
.item span{font:700 12.5px/1.3 var(--body);color:var(--muted);text-align:center;flex:1}
.item button{margin-top:6px;min-height:40px;border-radius:12px;background:var(--leaf);color:#fff;font:600 16px var(--display)}
.item button:disabled{background:#e8d9c6;color:#9c8877;cursor:default}
.badge-i{border:2px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.badge-i .medal{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 18px var(--display);background:#efe5d8;color:#bba892}
.badge-i.got .medal{background:radial-gradient(circle at 35% 30%,#fff3b8,#f6c443 60%,#d9a01f);color:#7a5200}
.badge-i b{display:block;font:600 15px var(--display)} .badge-i span{font:700 12px var(--body);color:var(--muted)}
.center{text-align:center}
.prize{font:700 44px var(--display);color:var(--leafd);text-align:center;margin:2px 0 4px}
.big{display:block;margin:12px auto 0;min-height:50px;padding:0 30px;border-radius:999px;background:var(--pink);color:#fff;font:600 20px var(--display)}
#snapimg{width:100%;border-radius:16px;display:block;margin:0 0 12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row2 button{min-height:44px;padding:0 20px;border-radius:999px;font:600 16px var(--display);background:#f3e7d6}
/* meet sheet */
#meet{position:fixed;left:0;right:0;bottom:0;z-index:19;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
#meet .sheet{background:var(--cream);border-radius:26px;width:min(540px,100%);max-height:50vh;overflow:auto;padding:16px 16px 14px;box-shadow:0 -6px 40px rgba(60,40,30,.3);animation:pop .3s ease-out}
#meet .nm{font:700 34px/1 var(--display);text-align:center}
#meet .org{display:flex;justify-content:center;align-items:center;gap:6px;margin:6px 0 12px;font:700 15px var(--body);color:var(--muted)}
#meet .org svg{width:20px;height:20px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.rc{border:2px solid var(--line);border-radius:14px;padding:6px 8px 8px;min-width:0}
.rc b{display:block;font:600 14px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc.new{border-color:var(--pink);background:#fff0f5}
.rc .t3{margin-top:3px;grid-template-columns:12px 1fr;gap:4px} .rc .t3 svg{width:11px;height:11px} .rc .t3 .tb{height:6px}
#meet .big{margin-top:12px}
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(rgba(191,232,247,.2),rgba(255,250,242,.5));padding:16px}
#start .card{background:var(--cream);border-radius:32px;padding:30px 28px 24px;text-align:center;width:min(380px,100%);box-shadow:0 20px 60px rgba(74,52,38,.25)}
#start h1{margin:0;font:700 clamp(40px,11vw,56px)/1 var(--display);color:var(--ink)}
#start h1 em{font-style:normal;color:var(--pink)}
#start p{margin:10px 0 20px;font:700 17px var(--body);color:var(--muted)}
#start .play{min-height:60px;padding:0 50px;border-radius:999px;background:var(--pink);color:#fff;font:700 24px var(--display);box-shadow:0 5px 0 var(--pinkd)}
#start .play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pinkd)}
#start .last{margin-top:14px;font:700 14px var(--body);color:var(--muted)}
.chip.btn{cursor:pointer;border:0;color:var(--ink)}
.chip .away{display:flex;align-items:center;gap:2px;font:700 12px var(--body);color:#5b8def;margin-left:2px}
.chip .away svg{width:16px;height:16px}
.t3 .lb{font:700 10px var(--body);color:var(--muted)}
.t3.lab{grid-template-columns:16px 34px 1fr}
.t3.pulse svg{animation:ipulse .45s ease-out}
@keyframes ipulse{40%{transform:scale(1.7)}}
#tTrait{font:700 11px/1.3 var(--body);color:var(--muted);text-align:center;margin-top:1px}
.tbtns{display:flex;gap:5px;margin-top:6px;pointer-events:auto}
.tbtns button{flex:1;min-height:36px;border-radius:11px;font:600 14px var(--display);display:flex;align-items:center;justify-content:center;gap:4px;background:#f3e7d6}
.tbtns svg{width:18px;height:18px}
#tShow{background:var(--pink);color:#fff;animation:pulse 1.2s ease-in-out infinite}
#tStay.on{background:#ffe3ec;color:var(--pinkd)}
#family{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(270px,calc(100vw - 24px));background:var(--cream);border-radius:20px;padding:12px 14px;z-index:6;box-shadow:0 3px 0 rgba(74,52,38,.12),0 12px 30px rgba(74,52,38,.2);animation:pop .3s ease-out}
#family .fam{display:flex;align-items:center;gap:10px}
#family .fam>svg{width:58px;height:44px;flex:none}
#family .want{font:600 18px/1.2 var(--display)}
#family .sub{font:700 12px var(--body);color:var(--muted)}
#family .fb{display:flex;gap:6px;margin-top:10px}
#family .fb button{flex:1;min-height:42px;border-radius:12px;font:600 15px var(--display);background:#f3e7d6}
#family .fb .go{background:var(--leaf);color:#fff}
#family .fx{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;background:#f3e7d6;font:700 18px/1 var(--display)}
#family .fam{padding-right:26px}
.tabs{display:flex;gap:6px;margin:-4px 0 12px;flex-wrap:wrap}
.tabs button{min-height:38px;padding:0 14px;border-radius:999px;background:#f3e7d6;font:600 14px var(--display)}
.tabs button.on{background:var(--ink);color:#fff}
.badge-i.t1 .medal{background:radial-gradient(circle at 35% 30%,#f7d2b0,#c98a52 65%,#a0673a);color:#fff}
.badge-i.t2 .medal{background:radial-gradient(circle at 35% 30%,#fff,#c9d3de 60%,#9aa7b5);color:#4a5563}
.badge-i.t3 .medal{background:radial-gradient(circle at 35% 30%,#fff3b8,#f6c443 60%,#d9a01f);color:#7a5200}
.badge-i .pips{font:700 11px var(--body);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{background:#fff;border-radius:12px;padding:6px 6px 8px;box-shadow:0 3px 10px rgba(74,52,38,.15);transform:rotate(-1deg)}
.pc:nth-child(2n){transform:rotate(1.2deg)}
.pc img{width:100%;border-radius:8px;display:block;aspect-ratio:4/3;object-fit:cover;background:#f3e7d6}
.pc b{display:block;font:600 14px var(--display);margin-top:5px}
.pc span{font:700 11.5px/1.3 var(--body);color:var(--muted)}
.postcard{background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(74,52,38,.2);transform:rotate(-1.5deg)}
.postcard img{width:100%;border-radius:10px;display:block}
.postcard p{font:600 19px/1.35 var(--display);margin:10px 4px 2px}
.postcard small{font:700 13px var(--body);color:var(--muted);margin-left:4px}
.goal{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:600 16px var(--display);margin-bottom:6px}
.goal.done{border-color:var(--leaf);background:#eefbe9}
.goal span{font:700 13px var(--body);color:var(--muted)}
#start .new{background:#f3e7d6;color:var(--ink);box-shadow:none;font-size:18px;min-height:48px;padding:0 24px;margin-top:12px}
@media (max-width:640px){
  .chip{font-size:15px;padding:3px 10px 3px 4px} .chip svg{width:22px;height:22px}
  .hbtn .lbl{display:none} .hbtn{width:44px;padding:0;justify-content:center}
  .tool{width:60px;height:58px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"></div>

<div class="hud-l">
  <div class="chip pill" title="Money"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f6c443" stroke="#d99a1e" stroke-width="2"/><text x="12" y="16.6" font-size="13" text-anchor="middle" fill="#8a5a00" font-weight="800" font-family="Nunito,sans-serif">$</text></svg><b id="hMoney">0</b></div>
  <div class="chip pill" title="Meals in storage"><svg viewBox="0 0 24 24"><path d="M2.5 12c3-5.2 9.3-6.3 13.4-3.1L21 5.8v12.4l-5.1-3.1C11.8 18.3 5.5 17.2 2.5 12z" fill="#7fc4e8"/><circle cx="8" cy="11" r="1.4" fill="#24415a"/></svg><b id="hFood">0</b></div>
  <button class="chip pill btn" id="bCats" title="Show me each cat"><svg viewBox="0 0 24 24" fill="#ff7aa2"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="5.6" cy="10" r="2.3"/><circle cx="9.6" cy="6.3" r="2.3"/><circle cx="14.4" cy="6.3" r="2.3"/><circle cx="18.4" cy="10" r="2.3"/></svg><b id="hCats">0</b><span class="away" id="hAway" hidden><svg viewBox="0 0 24 24"><path d="M8 13l-3 9 4-2 2 3 2-8zM16 13l3 9-4-2-2 3-2-8z" fill="#5b8def"/><circle cx="12" cy="9" r="6.5" fill="#ffcf3f"/></svg><i id="hAwayN"></i></span></button>
  <div class="chip pill" title="Ribbons"><svg viewBox="0 0 24 24"><path d="M8 13l-3 9 4-2 2 3 2-8zM16 13l3 9-4-2-2 3-2-8z" fill="#5b8def"/><circle cx="12" cy="9" r="6.5" fill="#ffcf3f" stroke="#e0a400" stroke-width="1.5"/></svg><b id="hRib">0</b></div>
  <div class="chip pill" title="Sanctuary stars"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#f6c443" stroke="#d99a1e" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="hStars">1</b></div>
</div>
<div class="hud-r">
  <button class="hbtn pill primary" id="bShop" aria-label="Shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 9h16l-1.5 11h-13z" fill="currentColor" fill-opacity=".25"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span class="lbl">Shop</span></button>
  <button class="hbtn pill" id="bBadges" aria-label="Badges"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#f6c443" stroke="#d99a1e" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="lbl">Badges</span></button>
  <button class="hbtn pill" id="bSnap" aria-label="Snapshot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6.5" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5l1.5-2.5h4l1.5 2.5"/></svg><span class="lbl">Snapshot</span></button>
  <button class="hbtn pill icon" id="bHints" title="Hints on/off" aria-label="Hints on/off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.4a2.8 2.8 0 1 1 3.8 2.6c-.8.4-1.1.9-1.1 1.8"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg></button>
  <button class="hbtn pill icon" id="bMusic" title="Music on/off" aria-label="Music on/off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V6l11-2v11.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="3"/><circle cx="17.5" cy="15.5" r="3"/></svg></button>
</div>

  if(r<0.52&&W.time>45){ const b=pick(items.filter(i=>i.kind==='bed'&&!i.occupant)); if(b&&Math.random()<0.8){ goTo(c,b.pos.x,b.pos.z,'bed',b); return; } setState(c,'sleep',rand(8,14)); return; }

function bat(c,ball){ const p=c.g.position, dx=ball.pos.x-p.x, dz=ball.pos.z-p.z, d=Math.hypot(dx,dz)||1;
  c.bat=0.45; if(d>1.5){ setState(c,'idle',1); return; } if(ball.tier>1){ ball.spin=7; c.s.fun=Math.min(100,c.s.fun+16); Snd.jingle(); c.nextPlay=null; setState(c,'idle',0.8); return; }
  ball.vel.set(dx/d*rand(2.2,3.6)+rand(-.6,.6),0,dz/d*rand(2.2,3.6)+rand(-.6,.6)); c.s.fun=Math.min(100,c.s.fun+12); Snd.jingle();
  c.nextPlay=(Math.random()<0.65&&(c.playN=(c.playN||0)+1)<4)?ball:null; if(!c.nextPlay)c.playN=0; setState(c,'idle',0.5); }

/* ---------- petting ---------- */
function onStroke(c,zone,frantic){
  if(c.state==='hiding'){ foundCat(c); return; } if(c.away>0||c.carried||c.leaveT>0||c.outside||c.leaving||['boop','path','greet','bye'].includes(c.state))return; const s=c.s, brush=W.tool==='brush', now=W.time;
  const iv=now-c.lastStroke; c.lastStroke=now; c.petT=3; tagFor(c,3);
  if(!['flop','sleep','pet','eat','litter','perch','shelter'].includes(c.state)) setState(c,'pet');
  if(c.state==='sleep'&&Math.random()<0.5)setState(c,'pet');
  if(zone==='belly'){ if(c.state==='flop'){ belly(c,frantic); return; } zone='chest'; }
  if(zone==='tail'){ c.over+=1.2; c.flick=0.6; if(c.over>=1.5)showIcon(c,'angry',1.2); return; }
  let like={head:1,cheek:1.1,chin:1.2,back:0.7,rump:0.6,chest:0.35,leg:0.15}[zone]??0.3;
  if(brush) like=(zone==='back'||zone==='rump')?1.1:(zone==='head'||zone==='cheek')?0.6:0.25;
  const slow=c.trait==='shy'?1.15:1;
  const rating=frantic||iv<(brush?0.7:1.3)*slow?'fast':(iv>=(brush?1.0:2.0)*slow&&iv<=7)?'good':'neutral';
  if(rating==='fast'){ c.over+=brush?0.6:1; c.streak=0; c.purr*=0.6; }
  else if(rating==='good'){
    s.aff=Math.min(100,s.aff+4*like*(1-s.aff/130)*(c.trait==='cuddly'?1.25:1)); s.trust=Math.min(100,s.trust+2*like*(1-s.trust/120)*(c.trait==='shy'?0.85:1)*kt(c)); c.lean=0.9; if(!brush&&Math.random()<0.3)c.turnTo=c.heading+rand(-0.9,0.9);
    if(brush){ s.groom=Math.min(100,s.groom+9*like); W.stat.brush++; spawnFx('spark',c.g.position.clone().setY(.75*c.g.scale.x),2,.35); }
    c.streak++; W.stat.good++; c.purr=clamp(0.35+s.aff/140,0,1)*Math.min(1,like+0.2);
    spawnFx('h',c.g.position.clone().setY(1.05*c.g.scale.x),1); Snd.ding();
    unlock('first_purr'); if(c.streak>=10)unlock('rhythm');
    if(!brush&&s.aff>=45&&c.hbCD<=0&&Math.random()<0.3){ c.hb=0.55; c.hbCD=rand(2,4); handFx('bump'); Snd.chirp(); }
    if(!brush&&s.aff>=40&&c.state==='pet'&&Math.random()<0.22){ setState(c,'flop',7); c.offer=true; }
    if(s.trust>=45&&c.slowBlink<=0&&Math.random()<0.2)c.slowBlink=1.9;
  } else { c.purr=Math.max(c.purr,0.25*like); s.aff=Math.min(100,s.aff+0.6*like); }
  { const fx=P.hx, fy=P.hy-(P.type==='mouse'?62:112);
    if(rating==='fast')floatAt(fx,fy,'Too fast!','bad'); else if(rating==='good')floatAt(fx,fy,c.streak>=2?`Purr! ×${c.streak}`:'Purr!','good'); else if(iv<(brush?1.0:2.0)*slow)floatAt(fx,fy,'A bit slower','bad'); }
  if(rating!=='fast'&&!brush&&s.trust>=35&&s.fun<60&&Math.random()<0.2){ c.bat=0.5; handFx('bump'); }
  if(s.trust<30||s.aff<25){ c.patience--; if(c.patience<=0){ c.patience=2+Math.floor(Math.random()*3); showIcon(c,'huff',1.5); walkAway(c,false); } }
}
function belly(c,frantic){
  const s=c.s; if(frantic)c.over+=1;
  if(s.trust>=75){ s.aff=Math.min(100,s.aff+5*(1-s.aff/130)); s.trust=Math.min(100,s.trust+1); c.purr=1; c.stT=Math.max(c.stT,3); W.stat.belly++; if(W.stat.belly>=3)unlock('belly');
    spawnFx('h',c.g.position.clone().setY(.8),2); Snd.ding(); return; }
  c.trap=0.5; s.trust=Math.max(0,s.trust-4); s.aff=Math.max(0,s.aff-2); handScratch(c); setTimeout(()=>{ if(c.state==='flop')walkAway(c); },350);
}
function overReact(c){
  const s=c.s; c.over=0; c.streak=0;
  if(s.trust>=50){ showIcon(c,'huff',1.5); s.aff=Math.max(0,s.aff-1); walkAway(c,Math.random()<0.5); }
  else { c.snap=0.4; s.trust=Math.max(0,s.trust-4); s.aff=Math.max(0,s.aff-2); handScratch(c); setTimeout(()=>walkAway(c),300); }
}
function handScratch(c){ Snd.hiss(); showIcon(c,'angry',2); cam.shake=0.25; W.aidT=45; handFx('jerk'); $('#hScr').style.opacity=1; setTimeout(()=>$('#hScr').style.opacity=0,1100);
  if(P.mode==='stroke'||P.mode==='catPending')P.mode='none'; floatAt(P.hx,P.hy-50,'Ouch!'); W.stat.scratches++; }
function blinkBack(c){ c.blinkBackT=0; c.gaze=0; c.slowBlink=1.8; const s=c.s; s.trust=Math.min(100,s.trust+3); s.aff=Math.min(100,s.aff+2); W.stat.blinkBack++;
  spawnFx('h',c.g.position.clone().setY(1.1*c.g.scale.x),3,.3); Snd.chirp(); unlock('slow_blink'); }

/* ---------- cat update ---------- */
function updateCat(c,dt){
  if(c.away>0){ c.away-=dt; if(c.away<=0)returnFromShow(c); return; }
  const s=c.s, adult=c.age>=1, n=active().length, crowded=n>LV().cap;
  const enrich=1+0.75*items.filter(i=>['ball','tree','bed'].includes(i.kind)).length/Math.max(1,n);
  const wet=weather.raining&&!shelterOf(c.g.position)&&!c.carried;
  s.full=Math.max(0,s.full-dt*(adult?0.2:0.26));
  s.fun=Math.max(0,s.fun-dt*0.17*(crowded?1.6:1)*(wet?1.5:1)/enrich);
  s.groom=Math.max(0,s.groom-dt*0.04);
  if(s.aff>30)s.aff-=dt*0.015;
  const ct=clamp(100-avgDirt()*14-(crowded?20:0),0,100); s.clean+=(ct-s.clean)*dt*0.03;
  if(c.nourT>0)c.nourT-=dt;
  const ht=s.full*0.35+s.fun*0.25+s.groom*0.2+s.clean*0.2+(W.tier.bowl>=3?6:0)+(c.nourT>0?6:0); s.health=clamp(s.health+(ht-s.health)*dt*0.04,0,100);
  if(!adult){ c.age=Math.min(1,c.age+dt/200); applyAge(c); if(c.age>=1)floatWorld(c.g.position.clone().setY(1.2),'Grown up!'); }
  c.litterNeed+=dt; c.breedCD-=dt; c.showCD-=dt; c.pounceT-=dt; c.hbCD-=dt; c.over=Math.max(0,c.over-dt*(c.trait==='calm'?0.6:0.35)); c.boopCD-=dt; c.blinkBackT-=dt; c.leaveT=(c.leaveT||0)-dt;
  if(c.hopT>0){ c.hopT-=dt; c.jump=Math.sin(clamp(1-c.hopT/c.hopDur,0,1)*Math.PI)*c.hopH; } else c.jump=0;
  if(c.petT<=0)c.purr=Math.max(0,c.purr-dt*0.6);
  if(c.over>=3)overReact(c);
  // look up at you and slow-blink
  if(s.trust>=35&&!c.carried&&['idle','pet','shelter','watch'].includes(c.state)&&c.gaze<=0){ c.gazeT-=dt; if(c.gazeT<=0){ c.gazeT=rand(22,45)*(s.trust>70?0.6:1); c.gaze=2.6; c.gazeBl=false; c.blinkBackT=4.2; W.stat.gazes++; if(c.state==='idle')c.stT=Math.max(c.stT,3); } }
  c.stretchT-=dt; if(c.stretchT<=0&&c.state==='idle'&&!c.carried&&c.stretch<=0){ c.stretchT=rand(35,70); c.stretch=1.8; c.stretchKind=pick(['bow','arch']); c.stT=Math.max(c.stT,2.2); }
  if(c.petT>0&&!c.carried&&s.aff>=45&&c.hbCD<=0&&W.time-c.lastStroke>0.8&&handOn(c)&&Math.random()<dt*1.8){ c.hb=0.55; c.hbCD=rand(2,4); s.aff=Math.min(100,s.aff+1); handFx('bump'); Snd.chirp(); spawnFx('h',c.g.position.clone().setY(1),1); }
  c.meowT-=dt;
  if(c.meowT<=0){ c.meowT=rand(10,24);
    if(s.full<30){ showIcon(c,'hungry',3); Snd.meow(1,1.2); }
    else if(avgDirt()>=4){ showIcon(c,'smell',3); Snd.meow(0.95,1); }
    else if(wet){ showIcon(c,'rain',2.5); }
    else if(s.fun<25){ showIcon(c,'bored',2.5); Snd.meow(1.1,0.6); }
    else if(Math.random()<0.25) Snd.meow(rand(0.95,1.25)*(adult?1:1.25),0.3); }
  if(c.carried){ c.speed=0; c.holdT+=dt; if(c.holdT>=c.tol)hopFree(c); return; }
  c.stT-=dt;
  if(!['walk','chase','laser','stalkBird','watch','path','boop'].includes(c.state)) c.speed=lerp(c.speed,0,Math.min(1,dt*8));
  if(c.lunge>0){ c.lunge-=dt; const p=c.g.position, ls=c.lungeSp||1.6; p.x+=Math.sin(c.heading)*ls*dt; p.z+=Math.cos(c.heading)*ls*dt; if(c.lunge<=0)c.lungeSp=0; }
  switch(c.state){
    case 'path': { const wp=c.path&&c.path[0]; if(!wp){ pathDone(c); break; } c.target.copy(wp); if(moveToward(c,dt,c.pathSpeed||1,0.2)){ c.path.shift(); if(!c.path.length)pathDone(c); } break; }
    case 'hiding': c.hideT=(c.hideT||0)-dt; if(c.hideT<=0){ c.hideT=rand(5,8); showIcon(c,'sniff',2); Snd.meow(1.25,0.35); } break;
    case 'greet': case 'bye': break;
    case 'boop': { const o=c.boopP; if(!o||o.state!=='boop'||o.away>0){ setState(c,'idle',1.5); break; } const op=o.g.position,p=c.g.position, d=dist2(p,op), want=(c.boopKind==='lick'?1.32:1.56)*(c.g.scale.x+o.g.scale.x)/2;
      c.heading=angLerp(c.heading,Math.atan2(op.x-p.x,op.z-p.z),dt*6); if(d>want){ c.speed=lerp(c.speed,0.5,Math.min(1,dt*4)); p.x+=Math.sin(c.heading)*c.speed*dt; p.z+=Math.cos(c.heading)*c.speed*dt; } else c.speed=lerp(c.speed,0,Math.min(1,dt*8));
      if(c.stT<=0)setState(c,'idle',2); break; }
    case 'pet': c.petT-=dt; if(c.turnTo!==undefined){ c.heading=angLerp(c.heading,c.turnTo,dt*1.5); if(Math.abs(angDiff(c.heading,c.turnTo))<0.05)c.turnTo=undefined; } if(c.petT<=0&&c.gaze<=0)setState(c,'idle',rand(1.5,3)); break;
    case 'flop': c.petT-=dt; if(c.stT<=0&&c.petT<=0)setState(c,'idle',1); break;
    case 'sleep': c.petT-=dt; s.health=Math.min(100,s.health+dt*(c.useItem?0.25*(c.useItem.tier||1):0.1)); if(c.stT<=0){ setState(c,'idle',2.5); c.stretch=1.8; c.stretchKind=pick(['bow','arch']); } break;
    case 'shelter': c.petT-=dt; if(c.stT<=0){ if(weather.raining)c.stT=rand(3,6); else setState(c,'idle',1); } break;
    case 'walk': if(c.after==='play'&&c.afterData)c.target.copy(c.afterData.pos);
      if(moveToward(c,dt,c.run?2.4:(adult?0.9:1.15),c.after==='play'?(c.afterData.tier>1?0.95:0.55):0.15)||c.stT<=0)arrive(c); break;
    case 'stalk': if(c.ball)c.heading=angLerp(c.heading,Math.atan2(c.ball.pos.x-c.g.position.x,c.ball.pos.z-c.g.position.z),dt*6); c.crouch=0.1; if(c.stT<=0){ hop(c,0.12,0.3); bat(c,c.ball); } break;
    case 'stalkBird': { const b=c.prey; if(!b||b.state!=='ground'||c.stT<=0){ if(b&&b.state==='fly'){ c.watchBird=b; } setState(c,'idle',1.5); break; }
      c.target.set(b.g.position.x,0,b.g.position.z); const d=dist2(c.g.position,b.g.position); c.crouch=0.15;
      if(d<1.25&&c.pounceT<=0){ hop(c,0.3*c.g.scale.x,0.5); c.lunge=0.45; c.pounceT=1.5; reward(c,7); birdFlee(b); setState(c,'idle',1.5); c.watchBird=b; }
      else moveToward(c,dt,0.45,1.1); break; }
    case 'watch': { const b=c.watch; if(!b){ setState(c,'idle',1); break; } const bp=b.g.position, d=dist2(c.g.position,bp);
      c.target.set(bp.x,0,bp.z); if(d>1.0)moveToward(c,dt,0.8,0.9); else c.heading=angLerp(c.heading,Math.atan2(bp.x-c.g.position.x,bp.z-c.g.position.z),dt*5);
      if(d<1.1&&bp.y<1.5&&c.pounceT<=0&&c.hopT<=0){ hop(c,clamp(bp.y-0.35,0.3,0.95)*c.g.scale.x,0.6); c.reach=0.6; c.pounceT=rand(1.4,2.4); reward(c,3); b.dodge(); }
      if(c.stT<=0){ c.watch=null; setState(c,'idle',1); } break; }
    case 'chase': { if(!wand.active||s.fun>=99||dist2(c.g.position,wand.feather)>7){ setState(c,'idle',1.5); break; }
      const f=wand.feather, d=dist2(c.g.position,f); c.target.set(f.x,0,f.z);
      if(f.y>0.75){ if(d<0.6&&c.pounceT<=0){ hop(c,clamp(f.y-0.45,0.35,0.9)*c.g.scale.x,0.6); c.reach=0.6; c.pounceT=1.2; reward(c,8); } else if(d>0.45)moveToward(c,dt,1.8,0.45); else c.heading=angLerp(c.heading,Math.atan2(f.x-c.g.position.x,f.z-c.g.position.z),dt*6); }
      else if(d<0.85&&wand.fSpeed>0.8&&c.pounceT<=0){ hop(c,0.28*c.g.scale.x,0.5); c.lunge=0.5; c.pounceT=1.1; reward(c,9); }
      else if(d<1.1&&wand.fSpeed<0.5){ c.crouch=0.3; c.heading=angLerp(c.heading,Math.atan2(f.x-c.g.position.x,f.z-c.g.position.z),dt*6); }
      else moveToward(c,dt,adult?2.0:2.2,0.6);
      if(c.stT<=0&&s.fun>90)setState(c,'idle',2); break; }
    case 'laser': { if(!laser.active||s.fun>=99){ setState(c,'idle',1.5); break; } c.target.copy(laser.pos); const d=dist2(c.g.position,laser.pos);
      if(d<1.4&&c.pounceT<=0&&c.hopT<=0){ c.heading=Math.atan2(laser.pos.x-c.g.position.x,laser.pos.z-c.g.position.z); hop(c,(0.25+d*0.18)*c.g.scale.x,0.45); c.lunge=0.45; c.lungeSp=d/0.45; c.reach=0.2; c.pounceT=0.9; s.fun=Math.min(100,s.fun+3.5); W.stat.laserP++;
        if(W.tier.laser>=2&&W.stat.laserP%8===0){ s.trust=Math.min(100,s.trust+1.5); s.full=Math.min(100,s.full+5); spawnFx('h',c.g.position.clone().setY(.8),2); floatWorld(c.g.position.clone().setY(1),'Treat!'); } }
      if(c.hopT<=0)moveToward(c,dt,4.6,0.3); break; }
    case 'eat': if(c.stT<=0){ const b=c.useItem; if(b&&b.portions>0){ const prem=b.prem>0; b.portions--; if(prem)b.prem--; updateBowl(b); s.full=Math.min(100,s.full+45); s.trust=Math.min(100,s.trust+1.5*kt(c)); spawnFx('h',c.g.position.clone().setY(.9),1);
        if(prem){ s.health=Math.min(100,s.health+3); s.aff=Math.min(100,s.aff+2); c.nourT=150; spawnFx('spark',c.g.position.clone().setY(.8),3,.3); } } setState(c,'idle',rand(2,4)); } break;
    case 'litter': if(c.stT<=0){ const l=c.useItem; if(l){ l.dirt=Math.min(l.cap,l.dirt+1); updateLitter(l); } c.litterNeed=0; setState(c,'idle',rand(1,3)); } break;
    case 'perch': s.fun=Math.min(100,s.fun+dt*0.5); if(c.stT<=0)setState(c,'idle',1); break;
    default: if(c.watchBird){ const bp=c.watchBird.g.position; c.heading=angLerp(c.heading,Math.atan2(bp.x-c.g.position.x,bp.z-c.g.position.z),dt*3); if(c.stT<=0)c.watchBird=null; }
      if(c.stT<=0){ if(c.nextPlay){ const b=c.nextPlay; c.nextPlay=null; goTo(c,b.pos.x,b.pos.z,'play',b); c.run=true; } else decide(c); }
  }
}
function reward(c,f){ const s=c.s; f*=(1+0.25*((W.tier.wand||1)-1))*(c.trait==='playful'?1.3:1); s.fun=Math.min(100,s.fun+f); s.trust=Math.min(100,s.trust+0.6*kt(c)); s.aff=Math.min(100,s.aff+0.5); W.stat.pounces++; if(Math.random()<0.4)spawnFx('h',c.g.position.clone().setY(.9),1); }

/* ---------- carrying (vet-style two-hand hold) ---------- */
const carryHands=[0,1].map(()=>{ const m=mesh(G.sph,0xffd8bd,{s:[0.2,0.08,0.17]}); m.visible=false; scene.add(m); return m; });
function startCarry(c){ $('#ring').hidden=true; if(c.away>0||c.outside||c.leaving||['greet','path','bye','hiding','boop'].includes(c.state))return; P.mode='carry'; P.cat=c; setState(c,'carried'); c.carried=true; c.purr=0; c.holdT=0;
  c.tol=c.s.trust>=70?9999:3+c.s.trust*0.12; Snd.meow(c.s.trust<40?0.9:1.3,0.4); handVis(); }
function dropCat(c){ if(!c.carried)return; c.carried=false; setState(c,'idle',rand(2,4)); W.stat.drops++;
  if(c.holdT<c.tol*0.5&&c.s.trust<80)c.s.trust+=0.8;
  for(const o of active()){ if(o!==c&&dist2(o.g.position,c.g.position)<1.9){ addBond(c,o,6); showIcon(c,'sniff',2); showIcon(o,'sniff',2); if(canBoop(o)){ c.boopCD=0; boop(c,o); }
      c.heading=Math.atan2(o.g.position.x-c.g.position.x,o.g.position.z-c.g.position.z); if(['idle','walk','pet'].includes(o.state)){ setState(o,'idle',3); o.heading=c.heading+Math.PI; } break; } }
  if(P.cat===c)P.mode=null; handVis(); }
function hopFree(c){ c.carried=false; if(P.cat===c&&P.mode==='carry')P.mode='none'; c.s.trust=Math.max(0,c.s.trust-3); hop(c,0.3,0.45); showIcon(c,'huff',1.5); walkAway(c); W.stat.drops++; handVis(); }

/* ---------- collisions ---------- */
function catCircles(c){ const p=c.g.position, s=c.g.scale.x, fx=Math.sin(c.heading)*0.27*s, fz=Math.cos(c.heading)*0.27*s; return [[p.x+fx,p.z+fz,0.3*s],[p.x-fx,p.z-fz,0.3*s]]; }
function solid(c){ return c.away<=0&&!c.carried&&!c.outside&&!c.leaving&&!['litter','perch'].includes(c.state)&&!(c.state==='sleep'&&c.useItem)&&c.jump<0.15; }
function collide(){
  const cs=active().filter(solid); const h=LV().half-0.35;
  for(let iter=0;iter<2;iter++){
    for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){ const a=cs[i],b=cs[j]; if(dist2(a.g.position,b.g.position)>1.6||(a.state==='boop'&&a.boopP===b))continue;
      for(const ca of catCircles(a))for(const cb of catCircles(b)){ const dx=cb[0]-ca[0],dz=cb[1]-ca[1],d=Math.hypot(dx,dz)||0.001,m=ca[2]+cb[2];
        if(d<m){ const push=(m-d)/2, nx=dx/d, nz=dz/d; a.g.position.x-=nx*push; a.g.position.z-=nz*push; b.g.position.x+=nx*push; b.g.position.z+=nz*push; } } }
    for(const c of cs){
      for(const it of items){ if(c.afterData===it||c.useItem===it)continue;
        if(it.kind==='ball'&&it.tier===1){ for(const cc of catCircles(c)){ const dx=it.pos.x-cc[0],dz=it.pos.z-cc[1],d=Math.hypot(dx,dz)||0.001,m=cc[2]+0.14; if(d<m){ const nx=dx/d,nz=dz/d; it.pos.x+=nx*(m-d); it.pos.z+=nz*(m-d); it.vel.x+=nx*(1.2+c.speed*1.3); it.vel.z+=nz*(1.2+c.speed*1.3); if(it.jT<=0){ Snd.jingle(); it.jT=0.4; } } } continue; }
        const obs=it.kind==='shelter'?it.posts.map(([x,z])=>[it.pos.x+x,it.pos.z+z,0.1]):itemR(it)?[[it.pos.x,it.pos.z,itemR(it)]]:[];

const cam={theta:0.55,phi:0.98,dist:8.5,want:8.5,target:new V3(0,0.3,0),shake:0,meet:null};
function updateCamera(dt){
  if(cam.focusT>0&&cam.focus&&!cam.meet){ cam.focusT-=dt; const fp=cam.focus.g.position; cam.target.x=lerp(cam.target.x,fp.x,Math.min(1,dt*4)); cam.target.z=lerp(cam.target.z,fp.z,Math.min(1,dt*4)); }
  if(cam.meet){ const fp=cam.meet.g.position; const fx=cam.target.x-camera.position.x, fz=cam.target.z-camera.position.z, fl=Math.hypot(fx,fz)||1;
    cam.target.x=lerp(cam.target.x,fp.x-fx/fl*1.3,Math.min(1,dt*3)); cam.target.z=lerp(cam.target.z,fp.z-fz/fl*1.3,Math.min(1,dt*3)); }
  cam.dist=lerp(cam.dist,cam.want,Math.min(1,dt*4));
  const t=cam.target; camera.position.set(t.x+cam.dist*Math.sin(cam.phi)*Math.sin(cam.theta),t.y+cam.dist*Math.cos(cam.phi),t.z+cam.dist*Math.sin(cam.phi)*Math.cos(cam.theta));
  if(cam.shake>0){ cam.shake-=dt; camera.position.x+=rand(-.07,.07); camera.position.y+=rand(-.07,.07); }
  camera.lookAt(t);
}
function clampTarget(){ const h=LV().half; cam.target.x=clamp(cam.target.x,-h-9,h+9); cam.target.z=clamp(cam.target.z,-h-12,h+6); }
function zoomBy(f){ cam.want=clamp(cam.want*f,3.2,LV().zoom*1.3); }
function clampIn(p){ const h=LV().half-0.2; p.x=clamp(p.x,-h,h); p.z=clamp(p.z,-h,h); p.y=0; return p; }

  for(const h of ray.intersectObjects(objs,true)){ const u=h.object.userData; if(u.pass||h.object.isSprite)continue; if(u.cat){ let z=u.zone; if(z==='back'){ const lp=u.cat.core.worldToLocal(h.point.clone()); if(lp.z<-0.26&&lp.y>-0.05)z='rump'; } return {cat:u.cat,zone:z}; } if(u.item)return {item:u.item}; } return null; }

const S={cat:null,len:0,zones:{},dir:null,t0:0,last:0};
function beginStroke(c,now){ S.cat=c; S.len=0; S.zones={}; S.dir=null; S.t0=now; S.last=now; }

function strokeMove(e,dx,dy){

  if(h.cat!==S.cat){ if(S.cat)finishStroke(); beginStroke(h.cat,now); }

function openShop(){

    const can=avail&&have<max&&W.money>=cost&&starOk; const lbl=!avail?(it.id==='laser'?'Owned':'Maxed'):have>=max?'Full':!starOk?`★${need} needed`:it.id==='fire'?'Let one go':`$${cost}`;
    const desc=it.id==='expand'?(LEVELS[W.level+1]?`Room for ${LEVELS[W.level+1].cap} cats`:'Biggest already'):it.desc;
    return `<div class="item"><div class="ico"><svg viewBox="0 0 24 24">${IC[it.id]}</svg></div><b>${it.name()}</b><span>${desc}${it.max&&max<99?` · ${have}/${max}`:''}</span><button data-buy="${it.id}" ${can?'':'disabled'}>${lbl}</button></div>`; }).join('');
  const kinds=Object.keys(TIERS).filter(k=>k==='wand'||(k==='laser'?W.laser:countItems(k)>0)).filter(k=>W.tier[k]<TIERS[k].length);

  openModal(`<h3>Shop</h3><div class="grid">${cards}</div>${ups?`<h3 style="margin-top:18px">Upgrades</h3><div class="grid">${ups}</div>`:''}`);

    for(const c of W.cats)if(c.useItem&&c.useItem.kind===k&&!c.carried)setState(c,'idle',1); for(const it of items)if(it.kind===k)buildItem(it); if(k==='wand')buildWandToy(); Snd.chime(); hud(); openShop(); });
}

const hintDone=new Set(), hintRetry={}; let curHint=null, hintT=0, hintGap=0;
function hideHint(){ curHint=null; hintEl.hidden=true; hintGap=4; }
function updateHints(dt){
  if(curHint){ hintT+=dt; const h=curHint;
    if(h.done&&h.done()){ hintDone.add(h.id); hideHint(); return; }
    if(h.auto&&hintT>h.auto){ if(!h.again)hintDone.add(h.id); else hintRetry[h.id]=W.time+20; hideHint(); return; }
    if(hintT>22){ hintRetry[h.id]=W.time+50; hideHint(); return; }
    let x,y; if(h.el){ ({x,y}=elC(h.el)); } else { const v=h.at(); if(!v){ hideHint(); return; } const s=toScreen(v); if(!s.ok){ hintEl.hidden=true; return; } x=s.x; y=s.y; }
    hintEl.hidden=!$('#modal').hidden||W.paused||P.mode==='carry'; hintEl.style.transform=`translate(${x}px,${y}px)`;
    const lab=hintEl.querySelector('.lab'); const lw=lab.offsetWidth; lab.style.marginLeft=(Math.max(0,lw/2+8-x)-Math.max(0,x+lw/2+8-innerWidth))+'px'; lab.style.top=y<130?'48px':'-70px';
    return; }
  hintGap-=dt; if(hintGap>0||!W.hints||!W.started||W.paused)return;
  for(const h of HINTS){ if(hintDone.has(h.id)||(hintRetry[h.id]&&W.time<hintRetry[h.id]))continue; if(h.done&&h.done()&&h.when()){ hintDone.add(h.id); continue; } if(h.when()){ curHint=h; hintT=0; hintEl.className='g-'+h.g; hintEl.querySelector('.lab').textContent=typeof h.label==='function'?h.label():h.label; hintEl.hidden=false; break; } }
}

  if(W.postQ.length&&W.postQ[0].t<=W.time&&$('#modal').hidden&&!W.paused){ const pq=W.postQ.shift(), hm=W.homes[pq.i]; if(hm){ openModal(`<div class="postcard">${hm.img?`<img src="${hm.img}" alt="${hm.name} in a new home">`:''}<p>${hm.line}</p><small>Love, the ${hm.fam} family</small></div><button class="big" id="pcOk">Aww</button>`,true); $('#pcOk').onclick=closeModal; Snd.chime(); } }
  extraT-=dt; if(extraT<=0){ extraT=1; checkCollection(); updateStars(); updateAch(); updateGoals(); hud(); }
}
function buildWandToy(){ const f=wand.fm; while(f.children.length)f.remove(f.children[0]); const T=W.tier.wand||1;
  if(T===1){ f.add(mesh(G.cone,0xff8fb1,{p:[0,-0.1,0],s:[0.05,0.22,0.05],r:[Math.PI,0,0.3]})); f.add(mesh(G.cone,0x7fd1ff,{p:[0.04,-0.1,0],s:[0.045,0.2,0.045],r:[Math.PI,0,-0.3]})); f.add(mesh(G.sph,0xffd84d,{s:[0.045,0.045,0.045]})); }

  else { f.add(mesh(G.sph,0x9da6b0,{p:[0,-0.06,0],s:[0.07,0.06,0.11]})); f.add(mesh(G.sph,0xf6b7c0,{p:[0.04,-0.01,0.05],s:[0.025,0.03,0.01]})); f.add(mesh(G.sph,0xf6b7c0,{p:[-0.04,-0.01,0.05],s:[0.025,0.03,0.01]})); f.add(mesh(G.cyl,0xf6b7c0,{p:[0,-0.07,-0.15],s:[0.006,0.12,0.006],r:[1.2,0,0]})); } }
let camCycle=-1; $('#bCats').onclick=()=>{ const cs=W.cats.filter(c=>c.away<=0&&!c.leaving); if(!cs.length)return; camCycle=(camCycle+1)%cs.length; const c=cs[camCycle]; cam.focus=c; cam.focusT=1.6; tagFor(c,4); };

/* ================= collars & petting-beat ring ================= */
(()=>{ const st=document.createElement('style'); st.textContent='#beat{position:fixed;left:0;top:0;width:50px;height:50px;margin:-25px 0 0 -25px;pointer-events:none;z-index:9}#beat svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(74,52,38,.25))}#beat span{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--display);color:#3f8f3d}#beat.ready svg{animation:ipulse .7s ease-in-out infinite}.float.bad{color:#ffd0c8}.float.good{color:#d6ffc9}.sw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 4px}.sw button{width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 8px rgba(74,52,38,.25)}'; document.head.appendChild(st);
  const b=document.createElement('div'); b.id='beat'; b.hidden=true; b.innerHTML='<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="rgba(255,250,242,.9)" stroke="#e8d9c6" stroke-width="5"/><circle id="beatFg" cx="22" cy="22" r="17" fill="none" stroke-width="5" stroke-linecap="round" transform="rotate(-90 22 22)" stroke-dasharray="106.8" stroke-dashoffset="106.8"/></svg><span id="beatTx"></span>'; document.body.appendChild(b); })();
function updateBeat(){ const el=$('#beat'); let c=null;
  if(P.mode==='stroke'&&S.cat)c=S.cat; else if(P.mode==='catPending')c=P.cat; else if(P.type==='mouse'&&!P.mode&&P.hoverCat&&P.hoverCat.petT>0)c=P.hoverCat;

  const fg=$('#beatFg'); fg.style.strokeDashoffset=106.8*(1-p); fg.style.stroke=p>=1?'#5fb35a':'#f0a13a'; el.classList.toggle('ready',p>=1); $('#beatTx').textContent=p>=1?'✓':''; }
const COLLARS=[0xe2574c,0x5b9be6,0xff7aa2,0x5fb35a,0x9a86cf,0xf6c443,0x3d3532];
function setCollar(c,col){ if(c.collarM){ c.core.remove(c.collarM); c.collarM=null; } c.collar=col||null; if(!col)return;

  g.traverse(o=>{ if(o.isMesh){ o.userData.cat=c; o.userData.zone='chest'; } }); c.core.add(g); c.collarM=g; }

  document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{ if(W.money<15)return; W.money-=15; W.collarPick=+b.dataset.col; hud(); closeModal(); toast('Tap a cat to give it the collar'); }); }

/* ================= LOOP ================= */
let bondT=0, famT=0, slowT=0, birdT=8;
function update(dt){
  W.time+=dt;
  if(P.mode==='catPending'&&!P.moved&&W.tool==='hand'){ const e=performance.now()-P.t0, r=$('#ring');
    if(e>130){ r.hidden=false; r.style.transform=`translate(${P.hx}px,${P.hy}px)`; r.style.setProperty('--p',clamp((e-130)/320,0,1)); }
    if(e>450)startCarry(P.cat); }
  if(P.mode==='stroke'&&S.cat&&S.len>=40&&performance.now()-S.last>260){ const c=S.cat; finishStroke(); beginStroke(c,performance.now()); }
  updateBeat();
  for(const c of W.cats){ const p=c.g.position; if(!isFinite(p.x)||!isFinite(p.y)||!isFinite(p.z)||!isFinite(c.heading)){ p.set(0,0,0); c.heading=0; c.speed=0; c.jump=0; c.hopT=0; c.lunge=0; c.target.set(0,0,0); if(!c.carried&&!c.outside)setState(c,'idle',1); } updateCat(c,dt); }
  for(const hp of helpers)updateHelper(hp,dt,performance.now()/1000);
  collide();
  for(const it of items){ if(it.kind!=='ball'||it.tier>1)continue; it.jT-=dt; const p=it.pos; p.addScaledVector(it.vel,dt); it.vel.multiplyScalar(Math.max(0,1-dt*1.4)); const h=LV().half-0.2;
    if(Math.abs(p.x)>h){ p.x=Math.sign(p.x)*h; it.vel.x*=-0.7; } if(Math.abs(p.z)>h){ p.z=Math.sign(p.z)*h; it.vel.z*=-0.7; }
    it.ball.rotation.x+=it.vel.z*dt/0.14; it.ball.rotation.z-=it.vel.x*dt/0.14; }
  bondT-=dt; if(bondT<=0){ bondT=1; const act=active().filter(c=>!c.carried&&!c.outside&&!c.leaving);
    for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++){ const a=act[i],b=act[j]; if(dist2(a.g.position,b.g.position)<1.9){
      let inc=0.35; if(a.petT>0||b.petT>0)inc+=0.8; inc*=(a.s.fun>40&&b.s.fun>40&&a.s.full>40&&b.s.full>40)?1.3:0.5; addBond(a,b,inc);
      if(getBond(a,b)>10&&canBoop(a)&&canBoop(b)&&Math.random()<0.09)boop(a,b); else if(getBond(a,b)>15&&Math.random()<0.05)heartBetween(a,b);
      if(act.length>LV().cap&&getBond(a,b)<20&&Math.random()<0.03){ showIcon(a,'angry',1.5); showIcon(b,'angry',1.5); Snd.hiss(); } } } }
  famT-=dt; if(famT<=0){ famT=5; tryFamily(); }
  strayT-=dt; if(strayT<=0){ strayT=rand(110,170); const act=active(); const avgH=act.reduce((a,c)=>a+c.s.health,0)/Math.max(1,act.length); if(W.cats.length<LV().cap&&avgH>=50)startDropoff(); }
  birdT-=dt; if(birdT<=0){ birdT=rand(6,14); if(birds.length<3+W.level&&!weather.raining)makeBird(); }
  slowT-=dt; if(slowT<=0){ slowT=0.3; hud(); const a=active(); if(a.length>=4&&a.every(c=>c.s.health>=80))unlock('bliss'); }
  if(W.aidT>0)W.aidT-=dt; $('#hAid').style.opacity=W.aidT>0?1:0;
  updateHints(dt); updateWeather(dt); extraUpdate(dt);
  let purr=0; for(const c of W.cats)if(c.away<=0)purr=Math.max(purr,c.purr*(handOn(c)?1:0.3)); Snd.purr(purr*0.9);
}
