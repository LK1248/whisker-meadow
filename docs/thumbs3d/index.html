<h1>Whisker Meadow: 3D thumbnail drafts</h1><p class="lead">Rendered from the game's own models with stills lighting (soft shadows, faceted low-poly shading, tone mapping, bloom). Each card also shows the image at small tile sizes.</p>
<h2>Box close-ups (round 2)</h2><div class="g"><figure><img src="boxCloseB.png" alt="Box close-up, smooth"><figcaption><b>Box close-up, smooth</b><span>Higher camera, almost-direct gaze, face fills the frame. Small tiles use a tighter shot.</span><div class="sm"><img src="boxCloseB_small.png" alt=""><img src="boxCloseB_small.png" alt=""></div></figcaption></figure><figure><img src="boxCloseD.png" alt="Box close-up, smooth, bigger eyes and ears"><figcaption><b>Box close-up, smooth, bigger eyes and ears</b><span>Eyes x1.25, ears x1.2.</span><div class="sm"><img src="boxCloseD_small.png" alt=""><img src="boxCloseD_small.png" alt=""></div></figcaption></figure><figure><img src="boxCloseC.png" alt="Box close-up, toon"><figcaption><b>Box close-up, toon</b><span>The game's stepped shading, lit for stills.</span><div class="sm"><img src="boxCloseC_small.png" alt=""><img src="boxCloseC_small.png" alt=""></div></figcaption></figure><figure><img src="boxCloseE.png" alt="Box close-up, toon, bigger eyes and ears"><figcaption><b>Box close-up, toon, bigger eyes and ears</b><span>Eyes x1.25, ears x1.2.</span><div class="sm"><img src="boxCloseE_small.png" alt=""><img src="boxCloseE_small.png" alt=""></div></figcaption></figure><figure><img src="boxCloseA.png" alt="Box close-up, low-poly"><figcaption><b>Box close-up, low-poly</b><span>Same framing with the original faceted look.</span><div class="sm"><img src="boxCloseA_small.png" alt=""><img src="boxCloseA_small.png" alt=""></div></figcaption></figure></div><h2 style="margin-top:28px">First drafts</h2><div class="g"><figure><img src="boxDusk.png" alt="Kitten in a box at dusk"><figcaption><b>A. Kitten in a box at dusk</b><span>The icon brought to 3D: cardboard box, knitted blanket, fireflies, lantern light.</span><div class="sm"><img src="boxDusk.png" alt=""><img src="boxDusk.png" alt=""></div></figcaption></figure><figure><img src="diorama.png" alt="Floating sanctuary"><figcaption><b>B. Floating sanctuary</b><span>The whole meadow as a tilt-shift island: house, fence, five cats. Shows what you build.</span><div class="sm"><img src="diorama.png" alt=""><img src="diorama.png" alt=""></div></figcaption></figure><figure><img src="goldenFlop.png" alt="Golden-hour belly flop"><figcaption><b>C. Golden-hour belly flop</b><span>Tuxedo rolled over in the grass, orange friend watching, long warm shadows.</span><div class="sm"><img src="goldenFlop.png" alt=""><img src="goldenFlop.png" alt=""></div></figcaption></figure><figure><img src="adoption.png" alt="The adoption moment"><figcaption><b>D. The adoption moment</b><span>A family at the gate, the cat shows its belly, hearts rise. The game's core payoff.</span><div class="sm"><img src="adoption.png" alt=""><img src="adoption.png" alt=""></div></figcaption></figure><figure><img src="zoomies.png" alt="Zoomies"><figcaption><b>E. Zoomies</b><span>Grey tabby mid-leap over a bench, friends watching. Energy and play.</span><div class="sm"><img src="zoomies.png" alt=""><img src="zoomies.png" alt=""></div></figcaption></figure><figure><img src="nightCozy.png" alt="Night, asleep together"><figcaption><b>F. Night, asleep together</b><span>Two cats curled in a bed under lantern light and fireflies. Calm and cozy.</span><div class="sm"><img src="nightCozy.png" alt=""><img src="nightCozy.png" alt=""></div></figcaption></figure><figure><img src="champion.png" alt="Show champion"><figcaption><b>G. Show champion</b><span>Groomed golden tabby on the winner's podium, rosette and confetti.</span><div class="sm"><img src="champion.png" alt=""><img src="champion.png" alt=""></div></figcaption></figure><figure><img src="tuxPortrait.png" alt="Big-eyed close-up"><figcaption><b>H. Big-eyed close-up</b><span>Tuxedo kitten looking right at you with little hearts. Faces tend to win clicks.</span><div class="sm"><img src="tuxPortrait.png" alt=""><img src="tuxPortrait.png" alt=""></div></figcaption></figure></div>
