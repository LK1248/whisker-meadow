<style>
/* Layout: full-screen 3D meadow; HUD chips top-left, buttons top-right, tool dock bottom; stats float above the cat in the world. Single sunny look. */
:root{
  --cream:#fffaf2; --ink:#4a3426; --muted:#8c7666; --pink:#ff7aa2; --pinkd:#e0577f;
  --leaf:#5fb35a; --leafd:#3f8f3d; --sky:#bfe8f7; --gold:#f6c443; --line:#efdfca; --blue:#5b9be6;
  --display:'Fredoka',ui-rounded,'Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#stage canvas.nocur{cursor:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.pill{background:var(--cream);border-radius:999px;box-shadow:0 2px 0 rgba(74,52,38,.12),0 6px 16px rgba(74,52,38,.12)}
#goalStrip{display:none!important}#bShop.nudge{animation:wmNudge .5s ease 3}@keyframes wmNudge{50%{transform:scale(1.14)}}
.goal .gm{display:inline-block;width:20px;height:20px;border-radius:50%;margin-right:7px;text-align:center;font:700 12px/20px var(--body);background:#eadfd3;color:#fff;vertical-align:-4px;font-style:normal}.goal .gm.t1{background:#e1a06a}.goal .gm.t2{background:#aab6c3}.goal .gm.t3{background:#f2bd2c}
#lockTip{position:fixed;z-index:9;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:14px;background:#fffaf2;box-shadow:0 4px 14px rgba(74,52,38,.25);pointer-events:auto}
#goalStrip0{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:60px;z-index:5;width:min(220px,55vw);padding:7px 12px 8px;border-radius:16px;text-align:left;font:700 12.5px/1.2 var(--body);color:#6b5546;display:flex;flex-direction:column;gap:3px;cursor:pointer}#goalStrip .gr{display:flex;justify-content:space-between;gap:8px}#goalStrip .gr em{font-style:normal;color:#a08876;font-variant-numeric:tabular-nums}#goalStrip .gr.done{color:#3f8f3a}#goalStrip .gb{height:4px;border-radius:3px;background:#efe3d3;overflow:hidden;margin-bottom:3px}#goalStrip .gb i{display:block;height:100%;background:#5fb35a;border-radius:3px;transition:width .5s}#goalStrip .gb.st i{background:#f6c443}#goalStrip .gr.st{color:#b07d10}.starHow{margin:12px 2px 0;color:var(--muted);font:700 13px/1.45 var(--body)}
.hud-l{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;max-width:55vw;z-index:5}
.chip.low{animation:lowPulse 1.1s ease-in-out infinite}
@keyframes lowPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,80,95,0)}50%{box-shadow:0 0 0 5px rgba(224,80,95,.55)}}
.chip{display:flex;align-items:center;gap:5px;padding:4px 12px 4px 5px;font:600 17px/1 var(--display);font-variant-numeric:tabular-nums}
.chip svg{width:26px;height:26px;flex:none}
.hud-r{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw;z-index:5}
.hbtn{min-height:44px;padding:0 15px;font:600 15px var(--display);display:flex;align-items:center;gap:6px}
.hbtn.primary{background:var(--pink);color:#fff}
.hbtn.icon{width:44px;padding:0;justify-content:center}
.hbtn svg{width:22px;height:22px}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:24px;z-index:5}

.tool svg{width:30px;height:30px}
.tool.on{background:#ffe3ec;color:var(--pinkd)}
body.tutLock .tool.tutOk:not(.on){animation:pulse 1.1s ease-in-out infinite;background:#ffe3ec;color:var(--pinkd);box-shadow:0 0 0 3px var(--pink)}
.tool.locked{opacity:.45}
.tool .lock{position:absolute;top:4px;right:6px;font:700 10px var(--body);background:var(--gold);color:#5a3d00;border-radius:8px;padding:1px 5px}
#tag{position:fixed;left:0;top:0;background:rgba(255,250,242,.95);border-radius:16px;padding:6px 10px 8px;width:132px;pointer-events:none;z-index:4;box-shadow:0 4px 14px rgba(74,52,38,.18)}

.t3{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:center;margin-top:4px}

#tempo .bg{fill:none;stroke:rgba(255,248,236,.92);stroke-width:12;stroke-linecap:round}#tempo .band{fill:none;stroke:#8fd17d;stroke-width:8;stroke-linecap:round}
#tempo .ndl{stroke:#4a3426;stroke-width:4.5;stroke-linecap:round}#tempo.on .ndl{stroke:#3f9b46}#tempo.fast .ndl{stroke:#e8743b}#tempo .hub{fill:#4a3426}
.metro{display:inline-block;width:14px;height:16px;margin-left:5px;vertical-align:-2px}.metro .arm{transform-origin:7px 14px;animation:metro 1s ease-in-out infinite alternate}
@keyframes metro{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
#hand{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;z-index:9;transition:opacity .15s}

#hand svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(74,52,38,.25))}
#hand .hb{display:none} #hand.brush .hb{display:block} #hand.brush .hp{display:none}
#hand.jerk svg{animation:jerk .5s}
@keyframes jerk{25%{transform:translate(-16px,26px) rotate(-22deg)}}
#hand.bump svg{animation:bump .45s}
@keyframes bump{35%{transform:translate(8px,-14px) rotate(8deg)}}
#hScr{transition:opacity .4s}
#ring{position:fixed;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;--p:0;background:conic-gradient(var(--pink) calc(var(--p)*1turn),rgba(255,255,255,.6) 0);-webkit-mask:radial-gradient(circle,transparent 26px,#000 27px);mask:radial-gradient(circle,transparent 26px,#000 27px);pointer-events:none;z-index:8}
#intro{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent var(--r,110px),rgba(30,20,45,.6) calc(var(--r,110px) + 120px));transition:opacity .7s}
#intro.off{opacity:0}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .6s;background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),transparent 0,transparent 46px,rgba(30,20,45,.6) 160px)}
body.shopLock:not(.shopOpen)::after,body.wandLock::after{opacity:1}#intro.slow{transition:opacity 2s}#pips,#introSkip{transition:opacity .8s}
#ghost{position:fixed;left:0;top:0;width:76px;height:76px;pointer-events:none;z-index:6;filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}
#ghost svg{width:100%;height:100%}
#pips{position:fixed;left:50%;top:16%;transform:translateX(-50%);display:flex;gap:14px;z-index:6;pointer-events:none}
#pips>svg{width:38px;height:38px;transition:transform .3s}
#pips>svg path{fill:rgba(255,255,255,.3);stroke:#fff;stroke-width:2;transition:fill .3s}
#pips>svg.on{transform:scale(1.25)}#pips>svg.on path{fill:#ff6f99}
#ghost.tap{width:58px;height:58px;opacity:.6}
#pips .eq{background:rgba(255,250,242,.92);border-radius:22px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#pips .eq svg{width:150px;height:46px}
#pips .eq3{display:flex;align-items:center;gap:10px}#pips .eq3 svg{width:36px;height:36px}
#tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;background:rgba(255,250,242,.94);border-radius:18px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.22);transition:opacity .4s}
#tip svg{display:block;width:150px;height:auto}
#scratch{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0}
#scratch.go{animation:scrFlash .9s ease-out forwards}

#scratch path{stroke-dasharray:1;stroke-dashoffset:1}

#scratch.go path:nth-child(2){animation-delay:.04s}#scratch.go path:nth-child(3){animation-delay:.08s}
@keyframes scrDraw{to{stroke-dashoffset:0}}
@keyframes scrFlash{0%{opacity:1;background:rgba(255,40,60,.32)}12%{background:rgba(255,40,60,.08)}22%{background:rgba(255,40,60,.22)}40%{opacity:1;background:transparent}100%{opacity:0}}
#tapRing{position:fixed;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:4px solid #fff;pointer-events:none;z-index:6;opacity:0;box-shadow:0 0 6px rgba(0,0,0,.3)}
#tapRing.go{animation:tapRing .55s ease-out}
@keyframes tapRing{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.5)}}
#introSkip,#lessonSkip{position:fixed;right:14px;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:7;width:46px;height:46px;border-radius:50%;background:rgba(255,250,242,.85);font-size:20px;color:#8c7666}
body.intro .dock,body.intro #hud,body.intro .top{opacity:.25;pointer-events:none}body.intro.tools .dock{opacity:1;pointer-events:auto;z-index:7}
.tool.tutGlow{animation:tutGlow 1.1s ease-in-out infinite;background:#fff6d6}
@keyframes tutGlow{0%,100%{box-shadow:0 0 0 0 rgba(246,196,67,.95);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(246,196,67,0);transform:scale(1.14)}}
.tool.nudge{animation:nudge .45s ease-in-out}

.ic3{display:flex;justify-content:space-around;align-items:flex-end;margin-top:4px;height:44px}

.fairpic .shine i:nth-child(1){left:38%;top:22%}.fairpic .shine i:nth-child(2){left:58%;top:34%;animation-delay:.4s;transform:scale(.7)}.fairpic .shine i:nth-child(3){left:44%;top:52%;animation-delay:.8s}.fairpic .shine i:nth-child(4){left:64%;top:18%;animation-delay:1.1s}.fairpic .shine i:nth-child(5){left:30%;top:42%;animation-delay:.6s}

@keyframes hstroke{0%{transform:translate(-30px,0);opacity:1}30%{transform:translate(30px,0);opacity:1}42%{transform:translate(30px,-14px);opacity:.35}88%{transform:translate(-30px,-14px);opacity:.35}100%{transform:translate(-30px,0);opacity:1}}

#toasts{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:7;pointer-events:none}

function angDiff(a,b){ return ((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; }

function obstAround(c){ const L=[], p=c.g.position;
  for(const it of items){ if(c.afterData===it||c.useItem===it||it.kind==='shelter')continue; const r=itemR(it); if(!r||(it.kind==='ball'&&it.tier===1))continue;
    L.push(it.kind==='tree'?[it.pos.x,it.pos.z,r,'big',0]:[it.pos.x,it.pos.z,r,'low',({bowl:0.32,litter:0.5,bed:0.42,ball:0.45})[it.kind]||0.4]); }
  for(const [x,z,r] of ponds())L.push([x,z,r,'big',0]);
  for(const o of W.decoObst||[])L.push(o[3]?o:[o[0],o[1],o[2],'big',0]);
  for(const o of W.cats)if(o!==c&&o.away<=0&&!o.carried&&!o.outside&&!o.leaving&&dist2(o.g.position,p)<4)L.push([o.g.position.x,o.g.position.z,0.36*o.g.scale.x+0.05,'cat',0.5*o.g.scale.x]);
  return L; }
// look ahead toward the target: sprinting cats leap low things, every cat swerves around big ones
function steerAround(c,dx,dz,d){ let want=Math.atan2(dx,dz); if(c.outside||c.carried||c.state==='path'||d<0.6)return want;
  const p=c.g.position, ux=dx/d, uz=dz/d, sprint=c.speed>1.8, sc=c.g.scale.x; let block=null, bAlong=1e9;
  c.leapCD=Math.max(0,(c.leapCD||0)-(c.lastDt||0.016));
  for(const o of obstAround(c)){ const rx=o[0]-p.x, rz=o[1]-p.z, along=rx*ux+rz*uz; if(along<=0||along>Math.min(d-o[2]*0.6,sprint?3.2:2.2))continue;
    const lat=rx*uz-rz*ux, R=o[2]+0.3*sc; if(Math.abs(lat)>=R)continue;
    const jumpable=o[3]!=='big'&&!(o[3]==='low'&&o[2]>0.8);
    if(sprint&&jumpable){ if(c.hopT<=0&&c.leapCD<=0&&along-o[2]<0.45+c.speed*0.1){ const dist=along+o[2]+0.4*sc, dur=clamp(dist/Math.max(c.speed,2),0.34,0.72);
        hop(c,(o[4]||0.4)+0.12,dur); c.leap=true; c.leapCD=dur+0.2; if(o[3]==='cat')W.stat.leaps=(W.stat.leaps||0)+1; }
      continue; }
    if(c.leap&&c.hopT>0)continue;
    if(along<bAlong){ bAlong=along; block=[rx,rz,R+0.15]; } }
  if(block){ const dc=Math.hypot(block[0],block[1])||0.001, ac=Math.atan2(block[0],block[1]), off=Math.asin(Math.min(1,block[2]/dc));
    const a1=ac+off, a2=ac-off, df=a=>Math.abs(Math.atan2(Math.sin(a-want),Math.cos(a-want)));

    const side=c.avoidSide&&Math.abs(c.avoidAc-ac)<0.6?c.avoidSide:(df(a1)<=df(a2)?1:-1); c.avoidSide=side; c.avoidAc=ac; want=side>0?a1:a2; }

function moveToward(c,dt,speed,stop=0.15){

  c.speed=lerp(c.speed,Math.min(speed,d*3),Math.min(1,dt*(speed>3?10:5)));

}
function walkAway(c,run=true,dist=2.6){ const p=c.g.position; let away=Math.atan2(p.x-camera.position.x,p.z-camera.position.z)+rand(-1.2,1.2);
  if(dist>3){ let best=-1; for(let i=0;i<10;i++){ const a=away+(i-5)*0.55, tx=clampX(p.x+Math.sin(a)*dist,0.4), tz=clampZ(p.z+Math.cos(a)*dist,0.4), d=Math.hypot(tx-p.x,tz-p.z)-Math.abs(i-5)*0.15; if(d>best){ best=d; away=a; } } } goTo(c,p.x+Math.sin(away)*dist,p.z+Math.cos(away)*dist,null); c.run=run; c.flick=0.8; c.over=0; c.purr=0; c.leaveT=2.2; c.petT=0; }
// cats spread out between roofs: distance counts, but so does how many cats are already under (or heading to) each one
function shelterLoad(sh,me){ return W.cats.filter(o=>o!==me&&!o.outside&&o.away<=0&&(shelterOf(o.g.position)===sh||(o.state==='walk'&&o.afterData===sh)||(o.state==='shelter'&&o.shelterAt===sh))).length; }
function shelterPick(c){ const sh=items.filter(i=>i.kind==='shelter'); if(!sh.length)return null; const p=c.g.position;
  return sh.map(s=>({s,score:Math.hypot(s.pos.x-p.x,s.pos.z-p.z)+shelterLoad(s,c)*2.2+(shelterLoad(s,c)>=4?8:0)})).sort((a,b)=>a.score-b.score)[0].s; }
function shelterOf(p){ return items.find(i=>i.kind==='shelter'&&Math.abs(p.x-i.pos.x)<1.0&&Math.abs(p.z-i.pos.z)<1.0); }

  if(s.full<58){ const b=nearest(items.filter(i=>i.kind==='bowl'&&i.portions>0),c); if(b){ const [x,z]=approach(c,b,0.74); goTo(c,x,z,'eat',b); return; }
    if(s.full<35&&c.age>0.2){ setState(c,'idle',rand(5,8)); c.sit=true; c.beg=c.stT; showIcon(c,'hungry',2.5); c.meowT=Math.min(c.meowT,rand(0.5,1.5)); return; } /* ask the player for food */

  if(laser.active&&s.fun<98&&dist2(p,laser.pos)<9){ setState(c,'laser',8); return; }

function arrive(c){

  if(a==='litter'&&it.dirt<it.cap&&!it.occupant){ setState(c,'litter',3.5); c.g.position.set(it.pos.x,0,it.pos.z); c.useItem=it; it.occupant=c; return; }
  if(a==='play'){ c.ball=it; c.heading=Math.atan2(it.pos.x-c.g.position.x,it.pos.z-c.g.position.z); setState(c,'stalk',rand(0.5,1)); return; }

/* ---------- petting ---------- */
function onStroke(c,zone,frantic,good){ rec('stroke',`${c.name} ${zone}${frantic?' frantic':''}${good?' ring':''}`);
  if(c.state==='hiding'){ foundCat(c); return; } if(c.away>0||c.carried||c.leaveT>0||c.outside||c.leaving||['boop','path','greet','bye'].includes(c.state))return; const s=c.s, brush=W.tool==='brush', now=W.time;
  const iv=now-c.lastStroke; c.lastStroke=now; c.petT=3; tagFor(c,3);
  if(!['flop','sleep','pet','eat','litter','perch','shelter'].includes(c.state)) setState(c,'pet');
  if(c.state==='sleep'){ setState(c,'pet'); c.slowBlink=1.9; c.purr=Math.max(c.purr,0.4); } // woken by a gentle stroke: no fuss, a sleepy blink and a purr
  if(zone==='belly'){ if(c.state==='flop'){ belly(c,frantic); return; } zone='chest'; }
  if(zone==='tail'){ c.over+=1.2; c.flick=0.6; if(c.over>=1.5)showIcon(c,'angry',1.2); return; }
  let like={head:1,cheek:1.1,chin:1.2,back:0.7,rump:0.6,chest:0.35,leg:0.15}[zone]??0.3;
  if(brush) like=(zone==='back'||zone==='rump')?1.1:(zone==='head'||zone==='cheek')?0.6:0.25;
  const slow=c.trait==='shy'?1.15:1;
  const rating=good?'good':frantic||iv<(brush?0.55:1.0)*slow?'fast':(iv>=(brush?0.8:1.55)*slow&&iv<=7)?'good':'neutral';
  if(rating==='fast'){ c.over+=brush?0.6:1; c.streak=0; c.purr*=0.6; }
  else if(rating==='good'){
    s.aff=Math.min(100,s.aff+4*like*(1-s.aff/130)*(c.trait==='cuddly'?1.25:1)); s.aff=Math.min(100,s.aff+2*like*(1-s.aff/120)*(c.trait==='shy'?0.85:1)*kt(c)); c.lean=0.9; if(!brush&&Math.random()<0.3)c.turnTo=c.heading+rand(-0.9,0.9);
    if(brush){ s.groom=Math.min(100,s.groom+9*like); W.stat.brush++; spawnFx('spark',c.g.position.clone().setY(.75*c.g.scale.x),2,.35); }
    c.streak++; W.stat.good++; c.purr=clamp(0.35+s.aff/140,0,1)*Math.min(1,like+0.2);
    spawnFx('h',c.g.position.clone().setY(1.05*c.g.scale.x),1); Snd.ding();
    unlock('first_purr'); if(c.streak>=10)unlock('rhythm');
    // the cat warms up: after 2 on-beat strokes it leans in and rubs, after 3 it shows off every stroke
    if(!brush&&c.streak>=2){ c.joy=Math.min(1,(c.streak-1)/3); c.lean=1.4; spawnFx('h',c.g.position.clone().setY(1.1*c.g.scale.x),1); }
    if(!brush&&c.streak>=3){ const r=Math.random();
      if(r<0.28&&s.aff>=35&&c.state==='pet'&&!lessonOn()){ setState(c,'flop',7); c.offer=true; c.petT=3; }
      else if(r<0.55&&c.hbCD<=0){ c.hb=0.55; c.hbCD=rand(1.5,3); handFx('bump'); Snd.chirp(); }
      else if(r<0.7){ c.elev=1.2; }
      else if(r<0.85&&c.slowBlink<=0){ c.slowBlink=1.9; }
      else { c.bat=0.5; handFx('bump'); } }
  } else { c.purr=Math.max(c.purr,0.25*like); s.aff=Math.min(100,s.aff+0.6*like); }
  { const fx=P.hx, fy=P.hy-(P.type==='mouse'?62:112);
    if(rating==='good'){ slowNag.n=0; floatAt(fx,fy,c.streak>=2?`Purr! ×${c.streak}`:'Purr!','good'); }
    else if(rating==='fast'||iv<(brush?0.8:1.55)*slow){ floatHourglass(fx,fy,rating==='fast'); slowNag.n++; if(slowNag.n>=4&&W.time>slowNag.next){ slowNag.n=0; slowNag.next=W.time+40; showSlow(); } } }
  if(rating!=='fast'&&!brush&&s.aff>=35&&s.fun<60&&Math.random()<0.2){ c.bat=0.5; handFx('bump'); }
  if(s.aff<30||s.aff<25){ c.patience--; if(c.patience<=0){ c.patience=2+Math.floor(Math.random()*3); showIcon(c,'huff',1.5); walkAway(c,false); } }
}
function belly(c,frantic){

  if(s.aff>=75){ s.aff=Math.min(100,s.aff+5*(1-s.aff/130)); s.aff=Math.min(100,s.aff+1); c.purr=1; c.stT=Math.max(c.stT,3); W.stat.belly++; if(W.stat.belly>=3)unlock('belly');
    spawnFx('h',c.g.position.clone().setY(.8),2); Snd.ding(); return; }

}

}

function blinkBack(c){ c.blinkBackT=0; c.gaze=0; if(c.iconKind==='blink'&&c.iconT>0.9)c.iconT=0.9; c.slowBlink=1.8; const s=c.s; s.aff=Math.min(100,s.aff+3); s.aff=Math.min(100,s.aff+2); W.stat.blinkBack++;

/* ---------- cat update ---------- */
// cats ease apart when their bodies overlap; how much room a cat needs depends on which way it faces
const PIN_ST=['litter','eat','perch','sleep','flop','pet','boop','groom','hiding','path','greet','bye','shelter','itch'];
function catReach(c,ux,uz){ return c.g.scale.x*(0.34+0.31*Math.abs(Math.sin(c.heading)*ux+Math.cos(c.heading)*uz)); }
function catSpace(dt){ const cs=W.cats.filter(c=>c.away<=0&&!c.carried&&!c.outside&&!c.leaving&&!(c.hopT>0)&&!(c.g.position.y>0.15));
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){ const a=cs[i], b=cs[j], pa=a.g.position, pb=b.g.position; let dx=pb.x-pa.x, dz=pb.z-pa.z; const d=Math.hypot(dx,dz); if(d>1.6)continue;
    if(a.state==='romp'&&a.rompP===b)continue; if(d<1e-4){ dx=1; dz=0; } else { dx/=d; dz/=d; }
    const m=catReach(a,dx,dz)+catReach(b,dx,dz); if(d>=m)continue;
    const fa=PIN_ST.includes(a.state)?0:1, fb=PIN_ST.includes(b.state)?0:1; if(!fa&&!fb)continue;
    const push=Math.min(m-d,dt*(0.7+0.9*Math.max(a.speed||0,b.speed||0)))/(fa+fb); pa.x=clampX(pa.x-dx*push*fa,0.3); pa.z=clampZ(pa.z-dz*push*fa,0.3); pb.x=clampX(pb.x+dx*push*fb,0.3); pb.z=clampZ(pb.z+dz*push*fb,0.3); } }
function updateCat(c,dt){
  if(c.away>0){ c.away-=dt; if(c.away<=0){ if(lessonOn()||tutLock())c.away=0.5; /* wait at the fair until the lesson is over */ else returnFromShow(c); } return; }
  landGlide(c,dt);
  const s=c.s, adult=c.age>=1, n=active().length, crowded=n>LV().cap;
  const enrich=1+0.75*items.filter(i=>['ball','tree','bed'].includes(i.kind)).length/Math.max(1,n);
  const wet=weather.raining&&!shelterOf(c.g.position)&&!c.carried;
